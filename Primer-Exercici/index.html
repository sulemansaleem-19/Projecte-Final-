<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Formulari PAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Formulari</h1>

<form id="formulari">

    
    <label>Nom i cognoms</label>
    <input type="text" id="nom">

    
    <label>Rang d’edats</label>
    <select id="edat">
        <option value="">Selecciona una opció</option>
        <option>0-17</option>
        <option>18-25</option>
        <option>26-40</option>
        <option>41-55</option>
        <option>56-65</option>
        <option>Més de 65</option>
    </select>

    
    <label>Codi postal</label>
    <input type="text" id="cp">

    
    <label>Correu electrònic</label>
    <input type="text" id="email">

   
    <label>Contrasenya</label>
    <input type="password" id="pass">
    <button type="button" onclick="mostrarPass('pass')">Mostrar/Ocultar</button>

   
    <label>Confirmar contrasenya</label>
    <input type="password" id="pass2">
    <button type="button" onclick="mostrarPass('pass2')">Mostrar/Ocultar</button>

    
    <label>
        <input type="checkbox" id="privacitat" required>
        Accepto la política de privacitat
    </label>

    <br><br>

   
    <button type="button" onclick="borrar()">Esborrar</button>
    <button type="button" onclick="enviar()">Enviar</button>

</form>

<div id="resultat"></div>

<script src="script.js"></script>
</body>
</html>
